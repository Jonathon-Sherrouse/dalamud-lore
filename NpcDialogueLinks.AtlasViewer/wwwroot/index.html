<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lore Atlas Viewer</title>
<style>
  /* Layout and visual language follow docs/atlas/ux-design.md (NDL-005). */
  :root {
    --bg: #15161a; --win: #1e1f24; --panel: #24262c; --panel-2: #2b2e35; --border: #3a3d46;
    --text: #e6e8ee; --muted: #9aa3b2; --accent: #d9b45a; --hover: #7fb2e5; --sel: #3b4256;
    --char: #7fb2e5; --org: #d9b45a; --loc: #7fcf9a; --evt: #c39bd3; --edge: #6b7486;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* The window: 760 x 480 minimum, as in the design. */
  .win { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; height: 100vh; min-width: 760px; min-height: 480px; background: var(--win); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--border); }
  .bar .lbl { color: var(--muted); font-size: 12px; margin-right: 6px; }
  .bar .title { font-weight: 600; margin-right: 6px; }
  .limit { position: relative; display: inline-flex; align-items: center; gap: 8px; }
  .menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 5; min-width: 290px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 4px; padding: 4px; box-shadow: 0 8px 24px #0008; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 8px; }
  .menu button:hover { background: var(--sel); }
  .menu button.current { color: var(--muted); cursor: default; }
  button { background: #34394a; color: var(--text); border: 1px solid var(--border); border-radius: 3px;
    padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--hover); }
  button.primary { background: var(--accent); color: #1b1b1b; border-color: var(--accent); }
  select { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 3px; padding: 4px 6px; font: inherit; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; vertical-align: middle; }
  .seg button { border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 4px 10px; }
  .seg button.on { background: var(--sel); color: var(--text); }
  .body { display: grid; grid-template-columns: 200px 1fr 280px; min-height: 0; }
  /* Changes lens: the change list takes the browse pane and the canvas (docs/atlas/ux-design.md, "v2 lenses"). */
  .body.changes { grid-template-columns: 1fr 280px; }
  .lensbar { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .lensbar .pos { color: var(--text); font-size: 12px; }
  .lensbar .cov { color: var(--muted); font-size: 12px; font-style: italic; }
  .arcpick { width: 100%; margin-bottom: 8px; }
  .recap-label { font-size: 10.5px; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; margin: 10px 0 4px; }
  .recap { margin: 0 0 6px; font-size: 13.5px; line-height: 1.5; }
  .crow { padding: 3px 4px; border-radius: 3px; }
  .crow .ended-in { color: var(--muted); font-size: 11.5px; }
  .crow .who { cursor: pointer; }
  .crow .who:hover { text-decoration: underline; }
  .changes-list { background: var(--panel); overflow: auto; padding: 12px 16px; min-height: 0; }
  .changes-list h2 { font-size: 15px; margin: 0 0 6px; }
  .changes-list .crow { cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .changes-list .crow:hover { background: var(--panel-2); }
  .changes-list .crow.selected { background: var(--sel); }
  .mark { width: 14px; flex: none; color: var(--muted); text-align: center; }
  .browse, .details { background: var(--panel); overflow: auto; padding: 10px; min-height: 0; }
  .browse { border-right: 1px solid var(--border); }
  .details { border-left: 1px solid var(--border); }
  input[type=search] { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 3px; padding: 5px 8px; font: inherit; }
  .notice { font-size: 12px; color: var(--muted); border-left: 2px solid var(--accent); padding: 2px 0 2px 8px; margin: 8px 0 0; }
  .grp { font-size: 10.5px; letter-spacing: .08em; color: var(--muted); margin: 12px 0 3px; border-bottom: 1px solid var(--border); padding-bottom: 2px; }
  .row { display: flex; align-items: center; gap: 7px; padding: 3px 5px; border-radius: 3px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row:hover { background: var(--panel-2); }
  .row.active { background: var(--sel); }
  .help { color: var(--muted); font-size: 12px; }
  main { position: relative; min-height: 0; }
  main svg { width: 100%; height: 100%; display: block; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
  .details h2 { font-size: 15px; margin: 0 0 2px; display: flex; gap: 8px; align-items: center; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .summary { margin: 0 0 6px; }
  .tag { font-size: 10px; color: var(--muted); border: 1px dashed var(--muted); border-radius: 3px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
  details.sources-box { margin: 8px 0 4px; color: var(--muted); font-size: 12px; }
  details.sources-box > summary { cursor: pointer; user-select: none; }
  .sources { margin: 6px 0 0; padding-left: 18px; }
  .sources li { margin: 2px 0; }
  .warn { font-size: 12px; color: var(--muted); border-left: 2px solid var(--accent); padding-left: 8px; margin-top: 6px; }
  a { color: var(--hover); }
  .h3 { font-size: 10.5px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin: 12px 0 4px;
    border-bottom: 1px solid var(--border); padding-bottom: 2px; }
  .conn { display: grid; grid-template-columns: 14px auto 1fr; gap: 6px; align-items: baseline; padding: 2px 4px; border-radius: 3px; }
  .conn:hover { background: var(--panel-2); }
  .conn.selected { background: var(--sel); }
  .conn .arrow { color: var(--muted); }
  .conn .rel { color: var(--muted); cursor: pointer; }
  .conn .rel:hover { color: var(--text); text-decoration: underline; }
  .conn .who { cursor: pointer; }
  .conn .who:hover { text-decoration: underline; }
  .card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 8px; margin-top: 6px; }
  .foot { display: flex; gap: 10px; align-items: center; padding: 6px 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .foot .spacer { flex: 1; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); }
  .badge.draft { color: #1b1b1b; background: var(--accent); border-color: var(--accent); }
  .glyph { flex: none; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 10; }
  .modal .box { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 18px; max-width: 420px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .error { padding: 40px; max-width: 560px; margin: 0 auto; }
  /* Halo behind canvas text so names stay legible where they cross an edge (ImGui: draw a dark backing rect). */
  svg text { fill: var(--text); font-size: 0.07px; paint-order: stroke; stroke: var(--win); stroke-width: 0.022px; stroke-linejoin: round; }
  svg .edge { stroke: var(--edge); stroke-width: 0.011; fill: none; }
  svg .edge.optional { stroke-dasharray: 0.035 0.028; }
  svg .edge-hit { stroke: transparent; stroke-width: 0.06; fill: none; cursor: pointer; }
  svg .edge.selected { stroke: var(--accent); stroke-width: 0.017; }
  /* Arc lens: a cast member's participation spoke to the arc entry: faint, unlabelled, not clickable. */
  svg .edge.spoke { stroke: var(--evt); stroke-opacity: .28; stroke-width: 0.008; }
  svg .edge-label { fill: var(--muted); font-size: 0.05px; cursor: pointer; }
  svg .edge-label.selected { fill: var(--accent); }
  svg .node { cursor: pointer; }
  svg .node .shape { stroke: #0e0f12; stroke-width: 0.012; }
  svg .node.focus .shape { stroke: #fff9; stroke-width: 0.02; }
  svg .node:hover .shape { stroke: var(--hover); }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Thin renderer over the shared AtlasSession (served by Program.cs). All browsing rules and player-facing
// text live in C#; this page only draws state and posts actions, exactly as the in-game window will.
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const color = g => g === "square" ? "var(--org)" : g === "diamond" ? "var(--loc)" : g === "hexagon" ? "var(--evt)" : "var(--char)";
// Regular hexagon points around (cx, cy), flat sides top and bottom (events and arc entries, schema v2).
const hexPoints = (cx, cy, r) => [0, 1, 2, 3, 4, 5].map(i => { const a = Math.PI / 3 * i; return `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`; }).join(" ");
let state = null, searchTimer = null, limitMenuOpen = false; // the menu's open flag is pure widget state, like an ImGui popup

async function load() { state = await (await fetch("/api/state")).json(); render(); }
async function act(type, value) {
  limitMenuOpen = false;
  state = await (await fetch("/api/action", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ type, value: value ?? null }) })).json();
  render();
}
async function reload() { state = await (await fetch("/api/reload", { method: "POST" })).json(); render(); }

function glyphSvg(glyph, size = 12) {
  const c = color(glyph), h = size / 2;
  const shape = glyph === "square" ? `<rect x="1.5" y="1.5" width="${size - 3}" height="${size - 3}" rx="1.5" fill="${c}"/>`
    : glyph === "diamond" ? `<polygon points="${h},0.5 ${size - 0.5},${h} ${h},${size - 0.5} 0.5,${h}" fill="${c}"/>`
    : glyph === "hexagon" ? `<polygon points="${hexPoints(h, h, h - 0.5)}" fill="${c}"/>`
    : `<circle cx="${h}" cy="${h}" r="${h - 1.5}" fill="${c}"/>`;
  return `<svg class="glyph" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${shape}</svg>`;
}

function nodeShape(glyph, r) {
  const c = color(glyph);
  if (glyph === "square") return `<rect class="shape" x="${-r}" y="${-r}" width="${2 * r}" height="${2 * r}" rx="${r * .15}" fill="${c}"/>`;
  if (glyph === "diamond") return `<polygon class="shape" points="0,${-r * 1.25} ${r * 1.25},0 0,${r * 1.25} ${-r * 1.25},0" fill="${c}"/>`;
  if (glyph === "hexagon") return `<polygon class="shape" points="${hexPoints(0, 0, r * 1.15)}" fill="${c}"/>`;
  return `<circle class="shape" r="${r}" fill="${c}"/>`;
}

function optTag(on) { return on ? `<span class="tag" title="${esc(state.text.optionalTooltip)}">${esc(state.text.optionalTag)}</span>` : ""; }

function graph(emptyText) {
  const L = state.layout;
  if (!L) return `<div class="empty">${esc(emptyText ?? state.text.emptyFocus)}</div>`;
  const pos = {};
  L.nodes.forEach(n => pos[n.id] = { x: n.x, y: n.y, n });
  const sel = state.selectedRelationship?.id;
  let edges = "", labels = "";
  for (const e of L.edges) {
    const a = pos[e.fromId], b = pos[e.toId];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const off = (e.laneIndex - (e.laneCount - 1) / 2) * 0.12;
    const pad = 0.16;
    const x1 = a.x + dx / len * pad + nx * off, y1 = a.y + dy / len * pad + ny * off;
    const x2 = b.x - dx / len * pad + nx * off, y2 = b.y - dy / len * pad + ny * off;
    // Faint, unlabelled spokes on the whole-cast chart only (D8); a refocused one-hop graph draws them as normal edges.
    if (e.participation && state.arc?.wholeCast) { edges += `<line class="edge spoke" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; continue; }
    const isSel = e.relationshipId === sel ? " selected" : "";
    const opt = e.optional ? " optional" : "";
    const marker = e.symmetric ? "" : ` marker-end="url(#arrow${isSel ? "-sel" : ""})"`;
    edges += `<line class="edge${isSel}${opt}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${marker}/>`
      + `<line class="edge-hit" data-rel="${esc(e.relationshipId)}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    const mx = (x1 + x2) / 2 + nx * 0.05, my = (y1 + y2) / 2 + ny * 0.05;
    const tip = e.optional ? `<title>${esc(state.text.optionalTooltip)}</title>` : "";
    labels += `<text class="edge-label${isSel}" data-rel="${esc(e.relationshipId)}" x="${mx}" y="${my}" text-anchor="middle">${tip}${esc(e.label)}</text>`;
  }
  let nodes = "";
  for (const n of L.nodes) {
    const p = pos[n.id], r = n.isFocus ? 0.11 : 0.075;
    nodes += `<g class="node${n.isFocus ? " focus" : ""}" data-focus="${esc(n.id)}" transform="translate(${p.x},${p.y})">`
      + `<title>${esc(n.name)}</title>` + nodeShape(n.glyph, r)
      + `<text y="${r + 0.095}" text-anchor="middle"${n.isFocus ? ' font-weight="600"' : ""}>${esc(n.name)}</text></g>`;
  }
  return `<svg viewBox="-1.6 -1.42 3.2 2.92" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(state.focus?.name ?? state.arc?.view?.entry.name ?? "")} connections">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7486"/></marker>
      <marker id="arrow-sel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9b45a"/></marker>
    </defs>${edges}${labels}${nodes}</svg>`;
}

// Collapsible, collapsed by default (D1); the open/closed state lives in the shared AtlasSession.
function sources(list, label) {
  if (!list?.length) return "";
  const items = list.map(c => c.url
    ? `<li><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer" title="${esc(state.text.externalLinkWarning)}">${esc(c.title)}</a></li>`
    : `<li>${esc(c.title)}</li>`).join("");
  const warn = list.some(c => c.url) ? `<div class="warn">${esc(state.text.externalLinkWarning)}</div>` : "";
  return `<details class="sources-box"${state.sourcesExpanded ? " open" : ""}><summary>${esc(label)}</summary>${warn}<ol class="sources">${items}</ol></details>`;
}

function details() {
  const f = state.focus, t = state.text;
  if (!f) return `<p class="help">${esc(t.emptyFocus)}</p>`;
  const sel = state.selectedRelationship?.id;
  const list = state.neighbors ?? [];
  const rows = list.map(n => {
    const arrow = n.symmetric ? "↔" : n.direction === "outgoing" ? "→" : "←";
    return `<div class="conn${n.relationshipId === sel ? " selected" : ""}"><span class="arrow">${arrow}</span>
      <span class="rel" data-rel="${esc(n.relationshipId)}">${esc(n.label)}</span>
      <span><span class="who" data-focus="${esc(n.entityId)}">${esc(n.entityName)}</span>${optTag(n.optional)}${n.onCanvas ? "" : ` <span class="help">${esc(t.listOnly)}</span>`}</span></div>`;
  }).join("");
  const card = selectedCard();
  const aliases = f.aliases.length ? " · " + f.aliases.map(esc).join(", ") : "";
  const back = state.arc?.view ? `<button data-wholecast>← ${esc(t.wholeCast)}</button><div style="height:8px"></div>` : "";
  return `${back}<h2>${glyphSvg(f.glyph, 14)}${esc(f.name)}</h2><div class="meta">${esc(f.category)}${aliases}</div>
    <p class="summary">${esc(f.summary)}${f.includesOptional ? `<span class="tag" title="${esc(t.optionalTooltip)}">${esc(t.optionalSummaryNote)}</span>` : ""}</p>
    ${sources(f.citations, f.sourcesLabel)}
    <div class="h3">${esc(t.connectionsHeading)} (${list.length})</div>${rows || `<div class="help">${esc(t.noConnections)}</div>`}${card}`;
}

// The selected connection's card, shared by the details pane and the Arc panel (L3): its sources and Close.
function selectedCard() {
  const t = state.text, r = state.selectedRelationship;
  return r ? `<div class="h3">${esc(t.selectedConnectionHeading)}</div><div class="card">
      <div><strong>${esc(r.source)}</strong> ${esc(r.label)} <strong>${esc(r.target)}</strong>${optTag(r.optional)}</div>
      ${sources(r.citations, r.sourcesLabel)}<button data-clear>${esc(t.closeConnection)}</button></div>` : "";
}

// A relationship row ("Tobin prisoner of The Drowned Court"); endpoint names refocus when the row is in the Arc panel.
function relRow(r, focusable) {
  const who = (id, name) => focusable ? `<span class="who" data-focus="${esc(id)}">${esc(name)}</span>` : `<strong>${esc(name)}</strong>`;
  return `${who(r.sourceId, r.sourceName)} ${esc(r.label)} ${who(r.targetId, r.targetName)}${optTag(r.optional)}`;
}

// Arc lens, nothing focused: the arc's name, its reviewed recap, and what is new and what has ended so far (no sources on rows).
function arcPanel() {
  const t = state.text, v = state.arc.view, e = v.entry;
  const rows = (list, none) => list.length
    ? list.map(r => `<div class="crow">${relRow(r, true)}${r.endedIn ? ` <span class="ended-in">(${esc(r.endedIn)})</span>` : ""}</div>`).join("")
    : `<div class="help">${esc(none)}</div>`;
  return `${selectedCard()}${state.selectedRelationship ? `<div style="height:10px"></div>` : ""}<h2>${glyphSvg(e.glyph, 14)}${esc(e.name)}</h2><div class="meta">${esc(e.category)}</div>
    <div class="recap-label">${esc(v.recapLabel)}</div>${v.asOf ? `<div class="meta">${esc(v.asOf)}</div>` : ""}
    <p class="recap">${esc(e.summary)}</p>
    ${sources(e.citations, e.sourcesLabel)}
    <div class="h3">${esc(v.newHeading)}</div>${rows(v.newRows, t.arcNothingNew)}
    <div class="h3">${esc(t.arcEnded)}</div>${rows(v.endedRows, t.arcNothingEnded)}`;
}

function changesList() {
  const t = state.text, c = state.changes, sel = c.selected?.key;
  if (!c.offered) return `<div class="changes-list"><p class="help">${esc(t.changesNotOffered)}</p></div>`;
  const mark = k => k === "added" ? "+" : k === "ended" ? "−" : "~";
  const groups = c.groups.length ? c.groups.map(g => `<div class="h3">${esc(g.label)}</div>` + g.rows.map(r =>
      `<div class="crow${r.key === sel ? " selected" : ""}" data-change="${esc(r.key)}"><span class="mark">${mark(r.kind)}</span><span>${r.entity ? `<strong>${esc(r.entity.name)}</strong>` : relRow(r, false)}</span></div>`).join("")).join("")
    : `<p class="help">${esc(t.noChanges)}</p>`;
  return `<div class="changes-list"><h2>${esc(c.label)}</h2>${groups}</div>`;
}

// The selected change. End evidence appears here, on an "ended" row, and nowhere else (v2 spoiler rule 2).
function changeDetails() {
  const t = state.text, r = state.changes?.selected;
  if (!state.changes?.offered) return "";
  if (!r) return `<p class="help">${esc(t.changesPickHint)}</p>`;
  if (r.entity) {
    const f = r.entity;
    return `<h2>${glyphSvg(f.glyph, 14)}${esc(f.name)}</h2><div class="meta">${esc(f.category)}</div>
      <p class="summary">${esc(f.summary)}${f.includesOptional ? `<span class="tag" title="${esc(t.optionalTooltip)}">${esc(t.optionalSummaryNote)}</span>` : ""}</p>${sources(f.citations, f.sourcesLabel)}`;
  }
  const ending = r.kind === "ended" ? sources(r.endCitations, r.endSourcesLabel) : "";
  return `<div class="card"><div>${relRow(r, false)}</div>${sources(r.citations, r.sourcesLabel)}${ending}</div>`;
}

function render() {
  const root = $("#root");
  if (!state.ok) {
    root.innerHTML = `<div class="error"><h2>Lore Atlas</h2><p>${esc(state.error)}</p>
      <p class="help">Details are printed in the viewer's terminal.</p><button id="reload">Reload data</button></div>`;
    $("#reload").onclick = reload;
    return;
  }
  const t = state.text;
  const ceiling = state.checkpoints.find(c => c.isCeiling);
  const viewOpts = state.checkpoints.map(c => `<option value="${esc(c.id)}"${c.isView ? " selected" : ""}${c.viewSelectable ? "" : " disabled"}>${esc(c.viewSelectable ? c.label : c.lockedLabel)}</option>`).join("");
  const menu = limitMenuOpen ? `<div class="menu">${state.checkpoints.map(c => c.isCeiling
      ? `<button class="current" disabled>✓ ${esc(c.label)}</button>`
      : `<button data-ceiling="${esc(c.id)}">${esc(c.label)}</button>`).join("")}</div>` : "";
  const seg = state.contentViews.map(v => `<button data-cv="${esc(v.id)}" class="${v.id === state.contentView ? "on" : ""}">${esc(v.label)}</button>`).join("");
  const groups = state.lens === "arc" && !state.arc?.view ? "" : state.groups.length
    ? state.groups.map(g => `<div class="grp">${esc(g.label.toUpperCase())}</div>` + g.entries.map(e =>
        `<div class="row${state.focus?.id === e.id ? " active" : ""}" data-focus="${esc(e.id)}" title="${esc(e.name)}">${glyphSvg(e.glyph)}${esc(e.name)}</div>`).join("")).join("")
    : `<p class="help">${esc(t.noResults)}</p>`;
  const lensSeg = state.lenses.map(l => `<button data-lens="${esc(l.id)}" class="${l.isCurrent ? "on" : ""}">${esc(l.label)}</button>`).join("");
  const arcPicker = state.arc ? `<label class="lbl" for="arcpick">${esc(t.arcPickerLabel)}</label><select id="arcpick" class="arcpick">${state.arc.picker.map(o =>
      `<option value="${esc(o.id ?? "")}"${o.isCurrent ? " selected" : ""}>${esc(o.label)}</option>`).join("")}</select>` : "";
  const hadFocus = document.activeElement?.id === "search";
  root.innerHTML = `<div class="win">
    <div class="bar">
      <span class="title">${esc(t.title)}</span>
      <span><label class="lbl" for="view">${esc(t.viewLabel)}</label><select id="view">${viewOpts}</select></span>
      <span class="limit"><span class="lbl">${esc(t.ceilingLabel)}</span>${esc(ceiling?.label)}
        <button id="raise" aria-haspopup="menu" aria-expanded="${limitMenuOpen}">${esc(t.raiseButton)}</button>${menu}</span>
      <span><span class="lbl">${esc(t.contentLabel)}</span><span class="seg">${seg}</span></span>
    </div>
    <div class="lensbar">
      <span><span class="lbl">${esc(t.lensHeading)}</span><span class="seg">${lensSeg}</span></span>
      <span class="pos">${esc(state.position)}</span>
      ${state.coverage ? `<span class="cov">${esc(state.coverage)}</span>` : ""}
    </div>
    ${state.lens === "changes" ? `<div class="body changes">${changesList()}<section class="details">${state.selectionWasReset ? `<div class="notice">${esc(t.selectionReset)}</div>` : ""}${changeDetails()}</section></div>` : `<div class="body">
      <aside class="browse">
        ${arcPicker}
        <input id="search" type="search" placeholder="${esc(t.searchPlaceholder)}" value="${esc(state.search)}" aria-label="${esc(t.searchPlaceholder)}">
        ${state.selectionWasReset ? `<div class="notice">${esc(t.selectionReset)}</div>` : ""}
        ${state.arc?.view ? `<div class="grp">${esc(state.arc.castHeading.toUpperCase())}</div>` : ""}
        ${groups}
      </aside>
      <main>${graph(state.lens === "arc" && !state.arc?.view ? t.noArc : null)}</main>
      <section class="details">${state.arc?.wholeCast ? arcPanel() : state.lens === "arc" && !state.arc?.view ? `<p class="help">${esc(t.noArc)}</p>` : details()}</section>
    </div>`}
    <div class="foot"><span>${esc(t.contentViewHelp)}</span><span class="spacer"></span>
      <span class="badge">local viewer</span>
      ${state.mode === "draft" ? `<span class="badge draft">Draft data — not shippable</span>` : `<span class="badge">strict</span>`}
      <button id="reload" title="Re-read the data file from disk">Reload data</button></div>
  </div>
  ${state.pendingCeiling ? `<div class="modal" role="dialog" aria-modal="true"><div class="box"><div>${esc(state.pendingCeiling.prompt)}</div>
    <div class="actions"><button id="cancel">${esc(t.cancelButton)}</button><button class="primary" id="confirm">${esc(t.confirmButton)}</button></div></div></div>` : ""}`;

  $("#reload").onclick = reload;
  $("#view").onchange = e => act("setView", e.target.value);
  $("#raise").onclick = () => { limitMenuOpen = !limitMenuOpen; render(); };
  root.querySelectorAll("[data-ceiling]").forEach(el => el.onclick = () => act("requestCeiling", el.dataset.ceiling));
  root.querySelectorAll("[data-cv]").forEach(el => el.onclick = () => { if (el.dataset.cv !== state.contentView) act("setContentView", el.dataset.cv); });
  root.querySelectorAll("[data-lens]").forEach(el => el.onclick = () => act("setLens", el.dataset.lens));
  root.querySelectorAll("[data-change]").forEach(el => el.onclick = () => act("selectChange", el.dataset.change));
  root.querySelectorAll("[data-wholecast]").forEach(el => el.onclick = () => act("showWholeCast"));
  const arcpick = $("#arcpick");
  if (arcpick) arcpick.onchange = e => act("pickArc", e.target.value);
  const search = $("#search");
  if (search) {
    search.oninput = e => { clearTimeout(searchTimer); const v = e.target.value; searchTimer = setTimeout(() => act("search", v), 120); };
    search.onkeydown = e => { const first = state.groups[0]?.entries[0]; if (e.key === "Enter" && first) act("focus", first.id); };
    if (hadFocus) { search.focus(); search.setSelectionRange(search.value.length, search.value.length); }
  }
  if (state.pendingCeiling) { $("#confirm").onclick = () => act("confirmCeiling"); $("#cancel").onclick = () => act("cancelCeiling"); }
  root.querySelectorAll("[data-focus]").forEach(el => el.onclick = () => act("focus", el.dataset.focus));
  root.querySelectorAll("[data-rel]").forEach(el => el.onclick = () => act("selectRelationship", el.dataset.rel));
  root.querySelectorAll("[data-clear]").forEach(el => el.onclick = () => act("clearSelection"));
  root.querySelectorAll("details.sources-box").forEach(el => el.ontoggle = () => {
    if (el.open !== state.sourcesExpanded) act("setSourcesExpanded", String(el.open));
  });
}

document.addEventListener("click", e => { if (limitMenuOpen && !e.target.closest(".limit")) { limitMenuOpen = false; render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && limitMenuOpen) { limitMenuOpen = false; render(); } });
load();
</script>
</body>
</html>
